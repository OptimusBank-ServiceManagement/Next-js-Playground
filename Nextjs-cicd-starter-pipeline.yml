trigger:
- app-dev

pr: none

pool:
  name: Default  # self-hosted Windows agent

# The Next.js app lives in another repo but in the SAME PROJECT
resources:
  repositories:
    - repository: nextApp
      type: git
      name: '<YourAppRepoName>'   # <<< CHANGE THIS to the exact repo name (same project)
      # ref: refs/heads/app-dev   # optional default branch

variables:
  - group: smtp-variables

  - name: repoName
    value: $[replace(variables['Build.Repository.Name'], '.*/','')]

  - name: nodeVersion
    value: '18.x'

  # IIS settings (you can hardcode siteName if you prefer app repo name)
  - name: siteName
    value: '$(repoName)'
  - name: physicalPath
    value: 'C:\inetpub\wwwroot\$(repoName)'
  - name: appPoolName
    value: '$(repoName)-pool'
  - name: parentSiteName
    value: 'Optimus Apps'

stages:
# ============================
# 1) VALIDATE (Cmd only)
# ============================
- stage: Validate
  displayName: 'Validate Project'
  jobs:
  - job: CheckProject
    displayName: 'Check for Next.js Project'
    steps:
    - checkout: self
      displayName: 'Checkout Infra Repo (CICD YAML)'

    - checkout: nextApp
      displayName: 'Checkout Next.js App Repo'

    - task: CmdLine@2
      displayName: 'Log context and list dirs'
      inputs:
        script: |
          echo ===== PIPELINE CONTEXT =====
          echo Build.Repository.Name: $(Build.Repository.Name)
          echo Build.SourceBranch   : $(Build.SourceBranch)
          echo Build.SourcesDirectory: $(Build.SourcesDirectory)
          echo System.DefaultWorkingDirectory: $(System.DefaultWorkingDirectory)
          echo Pipeline.Workspace   : $(Pipeline.Workspace)
          echo.
          echo ===== DIR: Build.SourcesDirectory =====
          dir "$(Build.SourcesDirectory)"
          echo.
          echo ===== DIR: nextApp =====
          if exist "$(Build.SourcesDirectory)\nextApp" (dir "$(Build.SourcesDirectory)\nextApp") else (echo nextApp not found)

    - task: CmdLine@2
      name: ProjectCheck
      displayName: 'Validate Next.js markers'
      inputs:
        script: |
          set APPROOT=$(Build.SourcesDirectory)\nextApp
          if not exist "%APPROOT%\package.json" (
            echo No package.json found in app repo
            echo ##vso[task.setvariable variable=hasProject;isOutput=true]false
            exit /b 0
          )

          rem Basic check: look for "next" string in package.json
          findstr /i "\"next\"" "%APPROOT%\package.json" >nul 2>nul
          if errorlevel 1 (
            echo "next" dependency not found in package.json
            echo ##vso[task.setvariable variable=hasProject;isOutput=true]false
          ) else (
            echo Next.js dependency marker found
            echo ##vso[task.setvariable variable=hasProject;isOutput=true]true
          )

# ============================
# 2) BUILD (Cmd only)
# ============================
- stage: Build
  displayName: 'Build Application'
  dependsOn: Validate
  condition: eq(dependencies.Validate.outputs['CheckProject.ProjectCheck.hasProject'], 'true')
  jobs:
  - job: BuildNextJs
    displayName: 'Build Next.js Application'
    steps:
    - checkout: self
      displayName: 'Checkout Infra Repo (CICD YAML)'
    - checkout: nextApp
      displayName: 'Checkout Next.js App Repo'

    - task: NodeTool@0
      displayName: 'Setup Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'

    - task: CmdLine@2
      displayName: 'Log Node & npm versions'
      inputs:
        script: |
          node -v
          npm -v
          echo PATH=%PATH%

    - task: Cache@2
      displayName: 'Cache node_modules'
      inputs:
        key: 'npm | "$(Agent.OS)" | $(Build.SourcesDirectory)/nextApp/package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(Build.SourcesDirectory)/nextApp/node_modules

    - task: CmdLine@2
      displayName: 'Install dependencies'
      inputs:
        script: |
          cd /d "$(Build.SourcesDirectory)\nextApp"
          if exist package-lock.json (
            echo Using npm ci
            npm ci --prefer-offline
          ) else if exist yarn.lock (
            echo Using yarn install --frozen-lockfile
            yarn install --frozen-lockfile --prefer-offline
          ) else (
            echo No lockfile; running npm install
            npm install
          )

    - task: CmdLine@2
      displayName: 'Run lint (non-blocking)'
      inputs:
        script: |
          cd /d "$(Build.SourcesDirectory)\nextApp"
          if exist package.json (
            rem Run lint if script exists; ignore failures
            npm run lint -- --no-fix --quiet || echo Lint finished with issues (ignored)
          )

    - task: CmdLine@2
      displayName: 'Run tests (if configured)'
      inputs:
        script: |
          cd /d "$(Build.SourcesDirectory)\nextApp"
          if exist package.json (
            npm run -s | findstr /b /i "  test" >nul 2>nul
            if not errorlevel 1 (
              echo Running tests...
              npm run test -- --watchAll=false --ci=true --coverage --reporters=default --reporters=jest-junit || exit /b 1
            ) else (
              echo No test script; skipping
            )
          )

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/junit.xml'
        failTaskOnFailedTests: true

    - task: PublishCodeCoverageResults@1
      displayName: 'Publish Code Coverage'
      condition: succeededOrFailed()
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(Build.SourcesDirectory)/nextApp/coverage/cobertura-coverage.xml'

    - task: CmdLine@2
      displayName: 'Build Application (next build)'
      inputs:
        script: |
          cd /d "$(Build.SourcesDirectory)\nextApp"
          set NODE_OPTIONS=--max_old_space_size=4096
          set NODE_ENV=production
          set NEXT_TELEMETRY_DISABLED=1
          echo NODE_ENV=%NODE_ENV%
          echo NEXT_TELEMETRY_DISABLED=%NEXT_TELEMETRY_DISABLED%
          echo NODE_OPTIONS=%NODE_OPTIONS%
          echo ===== RUNNING: npm run build =====
          npm run build || exit /b 1
          if exist ".next" (
            echo Build successful; listing .next
            dir /b ".next"
          ) else (
            echo .next not found; failing
            exit /b 1
          )

    - task: CmdLine@2
      name: ExportCheck
      displayName: 'Handle static export (if script exists)'
      inputs:
        script: |
          cd /d "$(Build.SourcesDirectory)\nextApp"
          set USE_STATIC=false
          npm run -s | findstr /b /i "  export" >nul 2>nul
          if not errorlevel 1 (
            echo Running npm run export...
            npm run export || echo Export failed
            if exist "out" (
              set USE_STATIC=true
              echo Static export found.
            )
          )
          echo ##vso[task.setvariable variable=useStaticExport;isOutput=true]%USE_STATIC%

    - task: CmdLine@2
      displayName: 'Prepare deployment package'
      inputs:
        script: |
          set PUBLISH=$(Build.ArtifactStagingDirectory)\publish
          set APPROOT=$(Build.SourcesDirectory)\nextApp
          set USE_STATIC=$(ExportCheck.useStaticExport)
          echo Publish dir: %PUBLISH%
          echo USE_STATIC: %USE_STATIC%
          if not exist "%PUBLISH%" mkdir "%PUBLISH%"
          cd /d "%APPROOT%"

          if /i "%USE_STATIC%"=="true" (
            if exist "out" (
              robocopy "out" "%PUBLISH%" /E /NFL /NDL /NJH /NJS /NC /NS
            ) else (
              echo out directory not found; treating as server-side
            )
          )

          if /i not "%USE_STATIC%"=="true" (
            if not exist ".next" (
              echo .next missing; build likely failed
              exit /b 1
            )
            robocopy ".next" "%PUBLISH%\.next" /E /NFL /NDL /NJH /NJS /NC /NS
            if exist "public" robocopy "public" "%PUBLISH%\public" /E /NFL /NDL /NJH /NJS /NC /NS
            if exist "package.json" copy /Y "package.json" "%PUBLISH%"
            if exist "package-lock.json" copy /Y "package-lock.json" "%PUBLISH%"
            if exist "yarn.lock" copy /Y "yarn.lock" "%PUBLISH%"
            for %%F in (next.config.js next.config.cjs next.config.mjs) do (
              if exist "%%F" copy /Y "%%F" "%PUBLISH%"
            )
          )

          echo Package ready at %PUBLISH%
          dir /b "%PUBLISH%"

    - task: CmdLine@2
      displayName: 'Create server.js (only for server-side)'
      condition: eq(variables['ExportCheck.useStaticExport'], 'false')
      inputs:
        script: |
          set PUBLISH=$(Build.ArtifactStagingDirectory)\publish
          if not exist "%PUBLISH%" mkdir "%PUBLISH%"
          > "%PUBLISH%\server.js" (
            echo const { createServer } = require('http')
            echo const { parse } = require('url')
            echo const next = require('next')
            echo.
            echo const dev = process.env.NODE_ENV !== 'production'
            echo const hostname = process.env.WEBSITE_HOSTNAME ^|^| 'localhost'
            echo const port = process.env.PORT ^|^| 3000
            echo.
            echo const app = next({ dev, hostname, port })
            echo const handle = app.getRequestHandler()
            echo.
            echo app.prepare().then(() => {
            echo ^  createServer(async (req, res) => {
            echo ^    try {
            echo ^      const parsedUrl = parse(req.url, true)
            echo ^      await handle(req, res, parsedUrl)
            echo ^    } catch (err) {
            echo ^      console.error('Error occurred handling', req.url, err)
            echo ^      res.statusCode = 500
            echo ^      res.end('internal server error')
            echo ^    }
            echo ^  }).listen(port, (err) => {
            echo ^    if (err) throw err
            echo ^    console.log(`> Ready on http://^${hostname}:^${port}`)
            echo ^  })
            echo })
          )
          echo Created %PUBLISH%\server.js

    - task: CmdLine@2
      displayName: 'Create web.config (only for server-side)'
      condition: eq(variables['ExportCheck.useStaticExport'], 'false')
      inputs:
        script: |
          set PUBLISH=$(Build.ArtifactStagingDirectory)\publish
          > "%PUBLISH%\web.config" (
            echo ^<?xml version="1.0" encoding="utf-8"?^>
            echo ^<configuration^>
            echo   ^<system.webServer^>
            echo     ^<handlers^>
            echo       ^<add name="iisnode" path="server.js" verb="*" modules="iisnode"/^>
            echo     ^</handlers^>
            echo     ^<rewrite^>
            echo       ^<rules^>
            echo         ^<rule name="NodeInspector" patternSyntax="ECMAScript" stopProcessing="true"^>
            echo           ^<match url="^server.js\/debug[\/]?" /^>
            echo         ^</rule^>
            echo         ^<rule name="StaticContent"^>
            echo           ^<action type="Rewrite" url="public{REQUEST_URI}"/^>
            echo         ^</rule^>
            echo         ^<rule name="DynamicContent"^>
            echo           ^<conditions^>
            echo             ^<add input="{REQUEST_FILENAME}" matchType="IsFile" negate="True"/^>
            echo           ^</conditions^>
            echo           ^<action type="Rewrite" url="server.js"/^>
            echo         ^</rule^>
            echo       ^</rules^>
            echo     ^</rewrite^>
            echo     ^<security^>
            echo       ^<requestFiltering^>
            echo         ^<hiddenSegments^>
            echo           ^<remove segment="bin"/^>
            echo         ^</hiddenSegments^>
            echo       ^</requestFiltering^>
            echo     ^</security^>
            echo     ^<httpErrors existingResponse="PassThrough" /^>
            echo     ^<httpCompression^>
            echo       ^<dynamicTypes^>
            echo         ^<add mimeType="application/json" enabled="true"/^>
            echo         ^<add mimeType="application/javascript" enabled="true"/^>
            echo       ^</dynamicTypes^>
            echo     ^</httpCompression^>
            echo     ^<iisnode watchedFiles="web.config;*.js" loggingEnabled="true" debuggingEnabled="false"/^>
            echo   ^</system.webServer^>
            echo ^</configuration^>
          )
          echo Created %PUBLISH%\web.config

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Build Artifacts'
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)/publish'
        artifactName: 'next-app'
        publishLocation: 'Container'

# ============================
# 3) DEPLOY (Cmd only, IIS)
# ============================
- stage: Deploy
  displayName: 'Deploy to IIS'
  dependsOn:
  - Validate
  - Build
  condition: and(succeeded(), eq(dependencies.Validate.outputs['CheckProject.ProjectCheck.hasProject'], 'true'))
  variables:
    useStaticExport: $[ stageDependencies.Build.BuildNextJs.outputs['ExportCheck.useStaticExport'] ]
  jobs:
  - deployment: DeployToIIS
    displayName: 'Deploy to IIS Server'
    environment: 'Production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@1
            displayName: 'Download Build Artifacts'
            inputs:
              buildType: 'current'
              artifactName: 'next-app'
              downloadType: 'single'
              downloadPath: '$(Pipeline.Workspace)'

          - task: CmdLine@2
            displayName: 'IIS deploy via appcmd/robocopy/icacls'
            inputs:
              script: |
                set SITENAME=$(siteName)
                set PHYSPATH=$(physicalPath)
                set APPPOOL=$(appPoolName)
                set PARENTSITE=$(parentSiteName)
                set SOURCE=$(Pipeline.Workspace)\next-app
                set USE_STATIC=$(useStaticExport)

                echo ===== DEPLOYMENT CONFIG =====
                echo Site: %SITENAME%
                echo PhysicalPath: %PHYSPATH%
                echo AppPool: %APPPOOL%
                echo ParentSite: %PARENTSITE%
                echo Source: %SOURCE%
                echo StaticExport: %USE_STATIC%

                if not exist "%SOURCE%" (
                  echo Source path missing: %SOURCE%
                  dir "$(Pipeline.Workspace)"
                  exit /b 1
                )

                set APPCMD=%windir%\system32\inetsrv\appcmd.exe

                rem Stop app pool if exists
                "%APPCMD%" list apppool /name:"%APPPOOL%" >nul 2>nul
                if not errorlevel 1 (
                  echo Stopping app pool %APPPOOL%...
                  "%APPCMD%" stop apppool /apppool.name:"%APPPOOL%"
                )

                rem Create app pool if not exists
                "%APPCMD%" list apppool /name:"%APPPOOL%" >nul 2>nul
                if errorlevel 1 (
                  echo Creating app pool %APPPOOL%...
                  "%APPCMD%" add apppool /name:"%APPPOOL%"
                )

                if /i "%USE_STATIC%"=="true" (
                  echo Configuring app pool runtime for static site
                  "%APPCMD%" set apppool "%APPPOOL%" /managedRuntimeVersion:v4.0
                ) else (
                  echo Configuring app pool runtime for Node (no managed runtime)
                  "%APPCMD%" set apppool "%APPPOOL%" /managedRuntimeVersion:
                )

                rem Ensure physical path exists and is clean
                if exist "%PHYSPATH%" rd /s /q "%PHYSPATH%"
                mkdir "%PHYSPATH%"

                rem Create or update IIS application under parent site
                "%APPCMD%" list app "%PARENTSITE%/%SITENAME%" >nul 2>nul
                if errorlevel 1 (
                  echo Creating IIS application /%SITENAME% under site "%PARENTSITE%"
                  "%APPCMD%" add app /site.name:"%PARENTSITE%" /path:/"%SITENAME%" /physicalPath:"%PHYSPATH%" /applicationPool:"%APPPOOL%"
                ) else (
                  echo Updating app pool and physical path
                  "%APPCMD%" set app "%PARENTSITE%/%SITENAME%" /applicationPool:"%APPPOOL%"
                  "%APPCMD%" set vdir "%PARENTSITE%/%SITENAME%/" /physicalPath:"%PHYSPATH%"
                )

                echo Copying files to %PHYSPATH%...
                robocopy "%SOURCE%" "%PHYSPATH%" /MIR /NFL /NDL /NJH /NJS /NC /NS
                if errorlevel 8 (
                  echo robocopy reported a fatal error
                  exit /b 1
                )

                if /i not "%USE_STATIC%"=="true" (
                  echo Installing production deps on server folder...
                  cd /d "%PHYSPATH%"
                  if exist package-lock.json (
                    npm ci --only=production --no-audit
                  ) else if exist yarn.lock (
                    yarn install --production --frozen-lockfile
                  ) else (
                    npm install --only=production --no-audit
                  )
                )

                echo Setting ACLs...
                icacls "%PHYSPATH%" /grant "IIS AppPool\%APPPOOL%":(OI)(CI)F /T
                icacls "%PHYSPATH%" /grant IIS_IUSRS:(OI)(CI)RX /T

                echo Starting app pool %APPPOOL%...
                "%APPCMD%" start apppool /apppool.name:"%APPPOOL%"

                echo ✓ Deployment completed

          - task: CmdLine@2
            displayName: 'Warm up (curl with retries)'
            inputs:
              script: |
                set URL=https://optiweb.optimusbank.com:8025/$(siteName)
                set RETRIES=5
                set COUNT=0
                if /i not "$(useStaticExport)"=="true" (
                  echo Waiting 15s for Node process to come up...
                  ping -n 16 127.0.0.1 >nul
                )
                :loop
                echo Warming up %URL% (attempt %COUNT% of %RETRIES%)...
                curl --insecure --max-time 30 -s -o NUL -w "HTTP %%{http_code}\n" "%URL%"
                if errorlevel 1 (
                  set /a COUNT+=1
                  if %COUNT% LSS %RETRIES% (
                    echo Retry in 10s...
                    ping -n 11 127.0.0.1 >nul
                    goto loop
                  ) else (
                    echo ⚠ Warm-up did not reach HTTP 200, continuing anyway.
                  )
                )

# ============================
# 4) SUMMARY (Cmd)
# ============================
- stage: Notify
  displayName: 'Summary'
  dependsOn:
  - Validate
  - Deploy
  condition: and(always(), eq(dependencies.Validate.outputs['CheckProject.ProjectCheck.hasProject'], 'true'))
  jobs:
  - job: FinalSummary
    displayName: 'Final Log Summary'
    steps:
    - task: CmdLine@2
      displayName: 'Log final status'
      inputs:
        script: |
          echo ==========================================
          echo PIPELINE EXECUTION SUMMARY
          echo ==========================================
          echo Application  : $(siteName)
          echo Status       : $(Agent.JobStatus)
          echo Build Number : $(Build.BuildNumber)
          echo Commit       : $(Build.SourceVersion)
          echo Branch       : $(Build.SourceBranchName)
          echo URL          : https://optiweb.optimusbank.com:8025/$(siteName)
          echo ==========================================
