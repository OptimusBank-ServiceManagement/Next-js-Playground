trigger:
- app-dev

pr: none

pool:
  name: Default    # self-hosted Windows agent

# =========================================================
# External repository (Next.js app lives here)
# =========================================================
resources:
  repositories:
    - repository: nextApp
      type: git
      name: 'NextAppPortal'   # replace with your actual Next.js repo

# =========================================================
# Variables (auto-detected repo name + IIS paths)
# =========================================================
variables:
  - group: smtp-variables

  - name: nodeVersion
    value: '18.x'

  - name: repoName
    value: $[ replace( variables['resources.repositories.nextApp.name'], '.*/', '') ]

  - name: siteName
    value: '$(repoName)'

  - name: physicalPath
    value: 'C:\inetpub\wwwroot\$(repoName)'

  - name: appPoolName
    value: '$(repoName)-pool'

  - name: parentSiteName
    value: 'Optimus Apps'

# =========================================================
# 1️⃣ VALIDATE — confirm this is a Next.js project
# =========================================================
stages:
- stage: Validate
  displayName: 'Validate Project'
  jobs:
  - job: CheckProject
    displayName: 'Check for Next.js Project'
    steps:
    - checkout: self
    - checkout: nextApp

    - task: PowerShell@2
      name: ProjectCheck
      displayName: 'Validate Next.js package.json'
      inputs:
        targetType: 'inline'
        script: |
          $appRoot = "$(Build.SourcesDirectory)\nextApp"
          Write-Host "Checking app folder: $appRoot"

          $pkg = Join-Path $appRoot "package.json"
          if (!(Test-Path $pkg)) {
            Write-Host "No package.json found"
            Write-Host "##vso[task.setvariable variable=hasProject;isOutput=true]false"
            exit 0
          }

          $content = Get-Content $pkg -Raw
          if ($content -match '"next"') {
            Write-Host "✓ Next.js detected"
            Write-Host "##vso[task.setvariable variable=hasProject;isOutput=true]true"
          } else {
            Write-Host "✗ No Next.js dependency found"
            Write-Host "##vso[task.setvariable variable=hasProject;isOutput=true]false"
          }

# =========================================================
# 2️⃣ BUILD — install, lint, test, build, package
# =========================================================
- stage: Build
  displayName: 'Build Application'
  dependsOn: Validate
  condition: eq(dependencies.Validate.outputs['CheckProject.ProjectCheck.hasProject'], 'true')
  jobs:
  - job: BuildNextJs
    displayName: 'Build Next.js Application'
    steps:
    - checkout: self
    - checkout: nextApp

    - task: NodeTool@0
      displayName: 'Setup Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'

    - task: PowerShell@2
      displayName: 'Log Node and npm versions'
      inputs:
        targetType: 'inline'
        script: |
          node -v
          npm -v

    - task: Cache@2
      displayName: 'Cache node_modules'
      inputs:
        key: 'npm | "$(Agent.OS)" | $(Build.SourcesDirectory)/nextApp/package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(Build.SourcesDirectory)/nextApp/node_modules

    - task: PowerShell@2
      displayName: 'Install Dependencies'
      inputs:
        targetType: 'inline'
        script: |
          cd "$(Build.SourcesDirectory)\nextApp"
          if (Test-Path "package-lock.json") {
            Write-Host "Using npm ci"
            npm ci --prefer-offline
          } elseif (Test-Path "yarn.lock") {
            Write-Host "Using yarn install"
            yarn install --frozen-lockfile --prefer-offline
          } else {
            npm install
          }

    - task: PowerShell@2
      displayName: 'Run Lint (non-blocking)'
      continueOnError: true
      inputs:
        targetType: 'inline'
        script: |
          cd "$(Build.SourcesDirectory)\nextApp"
          try {
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            if ($pkg.scripts.lint) {
              Write-Host "Running lint..."
              npm run lint -- --no-fix --quiet
            } else {
              Write-Host "No lint script."
            }
          } catch {
            Write-Host "Skipping lint due to error: $($_.Exception.Message)"
          }

    - task: PowerShell@2
      displayName: 'Run Tests'
      inputs:
        targetType: 'inline'
        script: |
          cd "$(Build.SourcesDirectory)\nextApp"
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.scripts.test) {
            Write-Host "Running tests..."
            npm run test -- --watchAll=false --ci=true --coverage --reporters=default --reporters=jest-junit
          } else {
            Write-Host "No tests defined."
          }

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/junit.xml'

    - task: PowerShell@2
      displayName: 'Build Next.js Application'
      inputs:
        targetType: 'inline'
        script: |
          $appRoot = "$(Build.SourcesDirectory)\nextApp"
          cd $appRoot
          $env:NODE_ENV = "production"
          $env:NEXT_TELEMETRY_DISABLED = "1"
          $env:NODE_OPTIONS = "--max_old_space_size=4096"

          # Create next.config.js with eslint.ignoreDuringBuilds
          if (!(Test-Path "next.config.js")) {
            Write-Host "Creating next.config.js with eslint.ignoreDuringBuilds=true"
            @"
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            eslint: { ignoreDuringBuilds: true },
          };
          module.exports = nextConfig;
          "@ | Out-File "next.config.js" -Encoding utf8
          }

          npm run build
          if (!(Test-Path ".next")) { Write-Error "Build failed"; exit 1 }

    - task: PowerShell@2
      name: ExportCheck
      displayName: 'Handle Static Export'
      inputs:
        targetType: 'inline'
        script: |
          cd "$(Build.SourcesDirectory)\nextApp"
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.scripts.export) {
            Write-Host "Running npm run export..."
            npm run export
            if (Test-Path "out") {
              Write-Host "##vso[task.setvariable variable=useStaticExport;isOutput=true]true"
              exit 0
            }
          }
          Write-Host "##vso[task.setvariable variable=useStaticExport;isOutput=true]false"

    - task: PowerShell@2
      displayName: 'Prepare Deployment Package'
      inputs:
        targetType: 'inline'
        script: |
          $publish = "$(Build.ArtifactStagingDirectory)\publish"
          $appRoot = "$(Build.SourcesDirectory)\nextApp"
          $useStatic = "$(ExportCheck.useStaticExport)"

          New-Item -ItemType Directory -Force -Path $publish | Out-Null
          cd $appRoot
          if ($useStatic -eq "true" -and (Test-Path "out")) {
            Write-Host "Copying static export..."
            Copy-Item "out\*" $publish -Recurse -Force
          } else {
            Write-Host "Copying server app..."
            Copy-Item ".next","public","package.json","next.config.js" -Destination $publish -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host "Publish directory ready:"
          Get-ChildItem $publish

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifacts'
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)/publish'
        artifactName: 'next-app'
        publishLocation: 'Container'

# =========================================================
# 3️⃣ DEPLOY — copy to IIS, configure, restart app pool
# =========================================================
- stage: Deploy
  displayName: 'Deploy to IIS'
  dependsOn: [Validate, Build]
  condition: and(succeeded(), eq(dependencies.Validate.outputs['CheckProject.ProjectCheck.hasProject'], 'true'))
  variables:
    useStaticExport: $[ stageDependencies.Build.BuildNextJs.outputs['ExportCheck.useStaticExport'] ]
  jobs:
  - deployment: DeployToIIS
    displayName: 'Deploy to IIS Server'
    environment: 'Production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@1
            inputs:
              buildType: 'current'
              artifactName: 'next-app'
              downloadType: 'single'
              downloadPath: '$(Pipeline.Workspace)'

          - task: PowerShell@2
            displayName: 'Deploy to IIS'
            inputs:
              targetType: 'inline'
              script: |
                $site = "$(siteName)"
                $phys = "$(physicalPath)"
                $pool = "$(appPoolName)"
                $parent = "$(parentSiteName)"
                $src = "$(Pipeline.Workspace)\next-app"
                $useStatic = "$(useStaticExport)"
                $appcmd = "$env:SystemRoot\System32\inetsrv\appcmd.exe"

                Write-Host "Deploying $site..."
                if (!(Test-Path $src)) { Write-Error "Source not found."; exit 1 }

                if (Test-Path $phys) { Remove-Item $phys -Recurse -Force }
                New-Item -ItemType Directory -Force -Path $phys | Out-Null

                & $appcmd list apppool /name:$pool > $null 2>&1
                if ($LASTEXITCODE -ne 0) { & $appcmd add apppool /name:$pool }

                if ($useStatic -eq "true") {
                  & $appcmd set apppool "$pool" /managedRuntimeVersion:v4.0
                } else {
                  & $appcmd set apppool "$pool" /managedRuntimeVersion:
                }

                & $appcmd stop apppool /apppool.name:$pool > $null 2>&1
                & $appcmd start apppool /apppool.name:$pool > $null 2>&1

                & $appcmd list app "$parent/$site" > $null 2>&1
                if ($LASTEXITCODE -ne 0) {
                  & $appcmd add app /site.name:"$parent" /path:/"$site" /physicalPath:"$phys" /applicationPool:"$pool"
                } else {
                  & $appcmd set vdir "$parent/$site/" /physicalPath:"$phys"
                }

                Write-Host "Copying files..."
                robocopy "$src" "$phys" /MIR /NFL /NDL /NJH /NJS /NC /NS | Out-Null
                icacls "$phys" /grant "IIS AppPool\$pool":(OI)(CI)F /T | Out-Null
                icacls "$phys" /grant "IIS_IUSRS":(OI)(CI)RX /T | Out-Null
                Write-Host "Deployment complete."

          - task: PowerShell@2
            displayName: 'Warm Up Application'
            inputs:
              targetType: 'inline'
              script: |
                $url = "https://optiweb.optimusbank.com:8025/$(siteName)"
                Write-Host "Warming up $url..."
                Start-Sleep -Seconds 15
                try {
                  $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30
                  Write-Host "Response: $($r.StatusCode)"
                } catch {
                  Write-Host "Warm-up failed: $($_.Exception.Message)"
                }

# =========================================================
# 4️⃣ NOTIFY — Final summary
# =========================================================
- stage: Notify
  displayName: 'Pipeline Summary'
  dependsOn: [Validate, Deploy]
  condition: always()
  jobs:
  - job: Summary
    steps:
    - task: PowerShell@2
      displayName: 'Final Summary Log'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "====================================="
          Write-Host "PIPELINE SUMMARY"
          Write-Host "====================================="
          Write-Host "Application : $(siteName)"
          Write-Host "Repo        : $(repoName)"
          Write-Host "Status      : $(Agent.JobStatus)"
          Write-Host "Branch      : $(Build.SourceBranchName)"
          Write-Host "URL         : https://optiweb.optimusbank.com:8025/$(siteName)"
          Write-Host "====================================="
